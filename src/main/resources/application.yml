spring:
  application:
    name: harmony-ai-gateway
  datasource:
    url: jdbc:h2:mem:gateway;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
mybatis:
  configuration:
    map-underscore-to-camel-case: true
jwt:
  # Production MUST replace the development secret via JWT_SECRET.
  secret: ${JWT_SECRET:yunmo-gateway-development-secret-change-in-production-2026}
  expiration-seconds: 86400
ai:
  models:
    - code: mock
      provider: mock
      model-name: mock-1
      enabled: true
    - code: gpt
      provider: openai
      base-url: https://api.openai.com
      api-key: ${OPENAI_API_KEY:}
      model-name: gpt-4o-mini
      enabled: false
    - code: glm
      provider: glm
      base-url: https://open.bigmodel.cn/api/paas/v4
      api-key: ${GLM_API_KEY:}
      model-name: glm-4-flash
      enabled: false
    - code: deepseek
      provider: deepseek
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}
      model-name: deepseek-chat
      enabled: false
